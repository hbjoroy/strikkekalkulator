name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: inf221-project-main

    steps:
      - uses: actions/checkout@v5

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
          cabal-version: "latest"

      - name: Cache cabal store
        uses: actions/cache@v5
        with:
          path: ~/.cabal/store
          key: ${{ runner.os }}-cabal-${{ hashFiles('inf221-project-main/project.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Update cabal package list
        run: cabal update

      - name: Build dependencies
        run: cabal build --only-dependencies

      - name: Build project
        run: cabal build

  docker:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCI registry
        uses: docker/login-action@v3
        with:
          registry: oci.bjoroy.me
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            oci.bjoroy.me/siren/strikkekalkulator:latest
            oci.bjoroy.me/siren/strikkekalkulator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
